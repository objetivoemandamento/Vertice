<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VÉRTICE — Atualização</title>
<style>body{margin:0;background:#111;color:#eee;font:16px system-ui;padding:32px}main{max-width:560px;margin:auto}button{width:100%;padding:15px;border:0;border-radius:10px;font-weight:700;cursor:pointer}a{color:#c9b07a}#status{margin:18px 0}</style>
</head>
<body><main><h1>VÉRTICE</h1><p>Atualização oficial do aplicativo.</p><div id="status">Verificando a versão mais recente…</div><a id="download" hidden></a><script>
const manifest='https://raw.githubusercontent.com/objetivoemandamento/Vertice/main/update.json';
(async()=>{try{const r=await fetch(manifest,{cache:'no-store'});if(!r.ok)throw Error('manifesto indisponível');const x=await r.json();document.getElementById('status').textContent='Versão disponível: '+x.versionName+' • build '+x.versionCode;const a=document.getElementById('download');a.href=x.apkUrl;a.textContent='BAIXAR APK';a.hidden=false;a.style.display='block';a.style.marginTop='12px';a.style.textDecoration='none';a.style.background='#c9b07a';a.style.color='#111';a.style.padding='15px';a.style.borderRadius='10px';a.style.textAlign='center';a.style.fontWeight='700';}catch(e){document.getElementById('status').textContent='Não foi possível consultar a atualização agora.';}})();
</script></main></body></html>
