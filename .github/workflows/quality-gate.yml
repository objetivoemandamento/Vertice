name: VÉRTICE Quality Gate
# Pull-request validation only; release publishing remains on the production workflow.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install backend
        working-directory: server
        run: npm install --ignore-scripts
      - name: Syntax
        working-directory: server
        run: npm run check
      - name: Web dashboard smoke tests
        working-directory: server
        run: npm run test:web
      - name: Kernel import
        working-directory: server
        run: npm run check:kernel

