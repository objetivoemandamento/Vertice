name: Build VÉRTICE GSI — Android Go / Low-RAM

on:
  workflow_dispatch:
  push:
    branches: [gsi-android-go-3-device]
    paths:
      - ".github/workflows/build-gsi.yml"
      - "rom/gsi/**"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: read

env:
  AOSP_BRANCH: android-latest-release
  AOSP_JOBS: 8

jobs:
  build-gsi:
    name: ${{ matrix.name }} (${{ matrix.product }})
    runs-on: ${{ vars.VERTICE_AOSP_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Galaxy A04
            device: galaxy-a04
            product: aosp_arm64_ab
          - name: Redmi 9A
            device: redmi-9a
            product: aosp_arm_64b_ab
          - name: Galaxy J2 Core
            device: j2-core
            product: aosp_arm_64b_a

    steps:
      - name: Checkout VÉRTICE
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo docker system prune -af || true
          df -h

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install AOSP host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses6 lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses6 libncurses-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare launcher manifest for system HOME role
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<category android:name="android.intent.category.LAUNCHER" />'
          extra = marker + '\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />'
          if 'android.intent.category.HOME' not in s:
              if marker not in s:
                  raise SystemExit("Launcher activity marker not found")
              s = s.replace(marker, extra, 1)
              p.write_text(s)
          PY

      - name: Build VÉRTICE APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Sync AOSP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aosp"
          cd "$GITHUB_WORKSPACE/aosp"
          repo init -u https://android.googlesource.com/platform/manifest -b "$AOSP_BRANCH" --depth=1
          repo sync -c --no-tags --optimized-fetch --prune -j"$AOSP_JOBS"

      - name: Inject VÉRTICE launcher integration
        run: |
          cd "$GITHUB_WORKSPACE/aosp"
          mkdir -p device/vertice/gsi/prebuilt
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" device/vertice/gsi/prebuilt/VerticeLauncher.apk
          cp "$GITHUB_WORKSPACE/rom/gsi/Android.bp" device/vertice/gsi/Android.bp
          cp "$GITHUB_WORKSPACE/rom/gsi/privapp-permissions-vertice.xml" device/vertice/gsi/privapp-permissions-vertice.xml

      - name: Extend selected AOSP GSI product
        run: |
          cd "$GITHUB_WORKSPACE/aosp"
          PRODUCT_MK="build/make/target/product/${{ matrix.product }}.mk"
          test -f "$PRODUCT_MK"
          cat >> "$PRODUCT_MK" <<'EOF'

          # VÉRTICE launcher integration.
          PRODUCT_PACKAGES += VerticeLauncher
          PRODUCT_COPY_FILES += \
              device/vertice/gsi/privapp-permissions-vertice.xml:system/etc/permissions/privapp-permissions-vertice.xml
          PRODUCT_PRODUCT_PROPERTIES += \
              ro.config.low_ram=true
          EOF

      - name: Build GSI system image
        run: |
          cd "$GITHUB_WORKSPACE/aosp"
          source build/envsetup.sh
          lunch "${{ matrix.product }}-userdebug"
          m -j"$AOSP_JOBS" systemimage

      - name: Validate and publish image
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          SYSTEM_IMG="$(find out/target/product -maxdepth 3 -type f -name system.img | head -n1)"
          test -n "$SYSTEM_IMG"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SYSTEM_IMG" "$GITHUB_WORKSPACE/dist/Vertice-GSI-${{ matrix.device }}.img"
          sha256sum "$GITHUB_WORKSPACE/dist/Vertice-GSI-${{ matrix.device }}.img" | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - name: Upload GSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertice-gsi-${{ matrix.device }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
