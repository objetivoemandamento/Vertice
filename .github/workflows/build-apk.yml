name: Build VÉRTICE APK
# Build trigger/check: compile and verify the existing Android project.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERTICE_KEYSTORE_BASE64: ${{ secrets.VERTICE_KEYSTORE_BASE64 }}
  VERTICE_STORE_PASSWORD: ${{ secrets.VERTICE_STORE_PASSWORD }}
  VERTICE_KEY_PASSWORD: ${{ secrets.VERTICE_KEY_PASSWORD }}
  VERTICE_KEY_ALIAS: ${{ secrets.VERTICE_KEY_ALIAS }}

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      VERTICE_BUILD_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v6
      - name: Validate server JavaScript
        run: node --check server/src/server.js
      - name: Validate server package JSON
        run: node -e "const p=require('./server/package.json'); JSON.parse(require('fs').readFileSync('server/package.json','utf8')); if(!p.engines?.node) process.exit(1); console.log('server/package.json OK; Node:',p.engines.node)"
      - name: Validate server dependency installation
        working-directory: server
        run: npm install --ignore-scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Validate stable Android signing secrets
        run: |
          test -n "$VERTICE_KEYSTORE_BASE64"
          test -n "$VERTICE_STORE_PASSWORD"
          test -n "$VERTICE_KEY_PASSWORD"
          test -n "$VERTICE_KEY_ALIAS"
          echo "Stable Android signing secrets detected."
      - name: Configure stable Android signing
        run: |
          printf '%s' "$VERTICE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vertice-release.jks"
          test -s "$RUNNER_TEMP/vertice-release.jks"
          echo "VERTICE_KEYSTORE_PATH=$RUNNER_TEMP/vertice-release.jks" >> "$GITHUB_ENV"
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify test APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed release APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          echo "APK_NAME=app-release.apk" >> "$GITHUB_ENV"
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "${APK_PATH}" --title "VÉRTICE ${GITHUB_RUN_NUMBER}" --notes "Build automático do VÉRTICE. Assinatura estável: true."
          APK_URL="https://github.com/objetivoemandamento/Vertice/releases/download/${TAG}/${APK_NAME}"
          printf '{"versionCode":%s,"versionName":"1.5.0","apkUrl":"%s","notes":"Atualização automática do VÉRTICE.","signed":true}\n' "$GITHUB_RUN_NUMBER" "$APK_URL" > update.json
          CONTENT=$(base64 -w 0 update.json)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq '.sha')
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            -f message='chore: update Android release manifest [skip ci]' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main'
      - uses: actions/upload-artifact@v6
        with:
          name: VERTEX-v1.5.0-teste-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: VERTEX-v1.5.0-definitivo-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
