name: Build VERTEX APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        run: node --check server/src/server.js && node --check server/src/vertice-preload.js
      - name: Validate server package JSON
        run: node -e "const p=require('./server/package.json'); JSON.parse(require('fs').readFileSync('server/package.json','utf8')); if(!p.engines?.node) process.exit(1); console.log('server/package.json OK; Node:',p.engines.node)"
      - name: Validate server dependency installation
        working-directory: server
        run: npm install --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VERTEX-v1.4.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
