name: VÉRTICE Web Release Validation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install --ignore-scripts
      - name: Validate backend syntax and deployment entrypoint
        working-directory: server
        run: npm run check
      - name: Test website modules and database URL normalization
        working-directory: server
        run: npm run test:web
      - name: Validate execution kernel imports
        working-directory: server
        run: npm run check:kernel
