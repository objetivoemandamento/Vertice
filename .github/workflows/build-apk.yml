name: Build VERTEX APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        run: node --check server/src/server.js && node --check server/src/vertice-preload.js
      - name: Validate server package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('server/package.json','utf8')); console.log('server/package.json OK')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VERTICE-v1.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
