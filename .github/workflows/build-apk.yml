name: Build VERTEX APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      VERTICE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        run: node --check server/src/server.js && node --check server/src/vertice-preload.js && node --check server/src/signup-preload.js && node --check server/src/ai-agent-preload.js
      - name: Validate server package JSON
        run: node -e "const p=require('./server/package.json'); JSON.parse(require('fs').readFileSync('server/package.json','utf8')); if(!p.engines?.node) process.exit(1); console.log('server/package.json OK; Node:',p.engines.node)"
      - name: Validate server dependency installation
        working-directory: server
        run: npm install --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "VÉRTICE ${GITHUB_RUN_NUMBER}" --notes "Build automático do VÉRTICE."
          fi
          APK_URL="https://github.com/objetivoemandamento/Vertice/releases/download/${TAG}/app-debug.apk"
          printf '{"versionCode":%s,"versionName":"1.4.4","apkUrl":"%s","notes":"Atualização automática do VÉRTICE."}\n' "$GITHUB_RUN_NUMBER" "$APK_URL" > update.json
          CONTENT=$(base64 -w 0 update.json)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq '.sha')
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            -f message='chore: update Android release manifest [skip ci]' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main'
      - uses: actions/upload-artifact@v4
        with:
          name: VERTEX-v1.4.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
