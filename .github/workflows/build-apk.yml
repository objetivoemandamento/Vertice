name: Build VERTEX APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERTICE_KEYSTORE_BASE64: ${{ secrets.VERTICE_KEYSTORE_BASE64 }}
  VERTICE_STORE_PASSWORD: ${{ secrets.VERTICE_STORE_PASSWORD }}
  VERTICE_KEY_PASSWORD: ${{ secrets.VERTICE_KEY_PASSWORD }}
  VERTICE_KEY_ALIAS: ${{ secrets.VERTICE_KEY_ALIAS }}

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      VERTICE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        run: node --check server/src/server.js && node --check server/src/vertice-preload.js && node --check server/src/signup-preload.js && node --check server/src/ai-agent-preload.js
      - name: Validate server package JSON
        run: node -e "const p=require('./server/package.json'); JSON.parse(require('fs').readFileSync('server/package.json','utf8')); if(!p.engines?.node) process.exit(1); console.log('server/package.json OK; Node:',p.engines.node)"
      - name: Validate server dependency installation
        working-directory: server
        run: npm install --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure stable Android signing
        if: ${{ env.VERTICE_KEYSTORE_BASE64 != '' && env.VERTICE_STORE_PASSWORD != '' && env.VERTICE_KEY_PASSWORD != '' && env.VERTICE_KEY_ALIAS != '' }}
        run: |
          printf '%s' "$VERTICE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vertice-release.jks"
          echo "VERTICE_KEYSTORE_PATH=$RUNNER_TEMP/vertice-release.jks" >> "$GITHUB_ENV"
          echo "Stable Android signing configured."
      - name: Build signed release APK
        if: ${{ env.VERTICE_KEYSTORE_BASE64 != '' && env.VERTICE_STORE_PASSWORD != '' && env.VERTICE_KEY_PASSWORD != '' && env.VERTICE_KEY_ALIAS != '' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Build debug APK fallback
        if: ${{ !(env.VERTICE_KEYSTORE_BASE64 != '' && env.VERTICE_STORE_PASSWORD != '' && env.VERTICE_KEY_PASSWORD != '' && env.VERTICE_KEY_ALIAS != '') }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Select APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_NAME=app-release.apk" >> "$GITHUB_ENV"
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_NAME=app-debug.apk" >> "$GITHUB_ENV"
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
          fi
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" --title "VÉRTICE ${GITHUB_RUN_NUMBER}" --notes "Build automático do VÉRTICE. Assinatura estável: ${SIGNED_BUILD}."
          fi
          APK_URL="https://github.com/objetivoemandamento/Vertice/releases/download/${TAG}/${APK_NAME}"
          printf '{"versionCode":%s,"versionName":"1.4.4","apkUrl":"%s","notes":"Atualização automática do VÉRTICE.","signed":%s}\n' "$GITHUB_RUN_NUMBER" "$APK_URL" "$SIGNED_BUILD" > update.json
          CONTENT=$(base64 -w 0 update.json)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq '.sha')
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            -f message='chore: update Android release manifest [skip ci]' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main'
      - uses: actions/upload-artifact@v4
        with:
          name: VERTEX-v1.4.4-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
