name: VERTICE 90 Quality Gate

on:
  push:
    branches: [main, hardening-90-percent]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find server/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Execution state tests
        run: npm run test:execution
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android compile verification
        run: gradle --no-daemon :app:assembleDebug
      - name: 90 percent quality gate
        run: npm run quality:90
