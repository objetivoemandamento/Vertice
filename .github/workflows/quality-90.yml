name: VERTICE 90 Quality Gate

on:
  push:
    branches: [main, hardening-90-percent]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find server/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Execution state tests
        run: npm run test:execution
      - name: 90 percent quality gate
        run: npm run quality:90
