name: vertice-production-load-audit
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/production-load-audit.yml"]
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Production load test
        run: |
          node <<'NODE'
          const {performance}=require('node:perf_hooks');
          const url='https://vertice-backend-8gj5.onrender.com/health';
          const concurrency=25, perWorker=20, timeoutMs=15000;
          const results=[];
          async function one(){
            const t=performance.now();
            const c=new AbortController();
            const timer=setTimeout(()=>c.abort(),timeoutMs);
            try{
              const r=await fetch(url,{signal:c.signal,headers:{'user-agent':'vertice-production-load-audit/1.0'}});
              await r.arrayBuffer();
              results.push({status:r.status,ms:performance.now()-t});
            }catch(e){results.push({status:'ERR',error:String(e),ms:performance.now()-t})}
            finally{clearTimeout(timer)}
          }
          async function worker(){for(let i=0;i<perWorker;i++)await one()}
          const t0=performance.now();
          await Promise.all(Array.from({length:concurrency},worker));
          const total=performance.now()-t0;
          const lat=results.map(x=>x.ms).sort((a,b)=>a-b);
          const p=q=>lat[Math.min(lat.length-1,Math.floor(q*(lat.length-1)))];
          const bad=results.filter(x=>x.status==='ERR'||x.status>=500);
          const summary={requests:results.length,concurrency,total_ms:total,throughput_rps:results.length/(total/1000),bad:bad.length,statuses:Object.fromEntries([...new Set(results.map(x=>x.status))].map(s=>[s,results.filter(x=>x.status===s).length])),avg_ms:lat.reduce((a,b)=>a+b,0)/lat.length,p50_ms:p(.5),p95_ms:p(.95),p99_ms:p(.99),max_ms:p(1)};
          console.log(JSON.stringify(summary,null,2));
          require('node:fs').writeFileSync('/tmp/load-summary.json',JSON.stringify(summary,null,2));
          if(bad.length)process.exit(1);
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertice-production-load-audit
          path: /tmp/load-summary.json
