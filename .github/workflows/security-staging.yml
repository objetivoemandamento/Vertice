name: vertice-security-staging
on:
  push:
    branches: ["feat/zero-trust-kernel-v2","main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  security-events: write
jobs:
  server-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      POSTGRES_PASSWORD: staging_admin_pw_ChangeMe_2026
      APP_DB_PASSWORD: staging_app_pw_ChangeMe_2026
      REDIS_PASSWORD: staging_redis_pw_ChangeMe_2026
      JWT_SECRET: staging_jwt_secret_ChangeMe_2026_0123456789
      VERTICE_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PAYMENT_CAPABILITY_SECRET: staging_payment_capability_ChangeMe_2026
      DATABASE_URL: postgresql://vertice_app:staging_app_pw_ChangeMe_2026@localhost:5432/vertice_staging
      REDIS_URL: redis://:staging_redis_pw_ChangeMe_2026@localhost:6379
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      CORS_ORIGINS: http://127.0.0.1:8080
      OWNER_LOGIN: owner@staging.vertice.test
      OWNER_PASSWORD: StagingOwnerPassword_2026!
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run typecheck
      - name: Start staging
        working-directory: .
        run: |
          docker compose -f docker-compose.staging.yml up -d postgres redis
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.staging.yml exec -T postgres pg_isready -U vertice_admin -d vertice_staging >/dev/null 2>&1 && docker compose -f docker-compose.staging.yml exec -T redis redis-cli -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml exec -T postgres pg_isready -U vertice_admin -d vertice_staging
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -v app_db_password="$APP_DB_PASSWORD" -f - <<'SQL'
          create role vertice_app login nosuperuser nobypassrls nocreaterole nocreatedb noreplication password :'app_db_password';
          SQL
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -c "grant connect on database vertice_staging to vertice_app; grant usage on schema public to vertice_app; alter default privileges in schema public grant select,insert,update,delete on tables to vertice_app; alter default privileges in schema public grant usage,select on sequences to vertice_app;"
          docker compose -f docker-compose.staging.yml ps
          echo "PostgreSQL/Redis ready; schema bootstrap will precede application startup."
      - name: Apply base schema and Zero-Trust migrations
        working-directory: .
        run: |
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -c "create role authenticated nologin; create schema if not exists auth; create or replace function auth.uid() returns uuid language sql stable as \$\$ select nullif(current_setting('app.user_id',true),'')::uuid \$\$;" 
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/db/schema.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260922_zero_trust_kernel.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260922_staging_hardening.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260923_operational_execution.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260923_security_hardening.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260923_ai_proposals.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260924_security_function_acl.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260924_function_search_path.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260924_rls_function_grants.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -f /dev/stdin < server/migrations/20260924023000_private_rls_function.sql
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging -c "alter role vertice_app nosuperuser nobypassrls nocreaterole nocreatedb; grant usage on schema public to vertice_app; grant select,insert,update,delete on all tables in schema public to vertice_app; grant usage,select on all sequences in schema public to vertice_app;"
          docker compose -f docker-compose.staging.yml up -d --build backend worker
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then cat /tmp/health.json; break; fi
            sleep 2
          done
          test -s /tmp/health.json
      - name: Seed isolated tenants
        working-directory: .
        run: |
          docker compose -f docker-compose.staging.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U vertice_admin -d vertice_staging <<'SQL'
          insert into users(id,email,password_hash) values
            ('00000000-0000-0000-0000-000000000001','tenant-a@example.test','x'),
            ('00000000-0000-0000-0000-000000000002','tenant-b@example.test','x')
          on conflict (id) do nothing;
          insert into tenants(id,name) values
            ('10000000-0000-0000-0000-000000000001','Tenant A'),
            ('10000000-0000-0000-0000-000000000002','Tenant B')
          on conflict (id) do nothing;
          insert into tenant_users(tenant_id,user_id,role) values
            ('10000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001','OWNER'),
            ('10000000-0000-0000-0000-000000000002','00000000-0000-0000-0000-000000000002','OWNER')
          on conflict do nothing;
          insert into subscriptions(user_id,tenant_id,plan,status,provider,current_period_start) values
            ('00000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','staging','active','internal',now()),
            ('00000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000002','staging','active','internal',now())
          on conflict do nothing;
          insert into devices(id,user_id,tenant_id,device_name,mode) values
            ('device-a','00000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','A','comando'),
            ('device-b','00000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000002','B','comando')
          on conflict do nothing;
          insert into commands(id,user_id,tenant_id,device_id,mode,command) values
            ('20000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000002','device-b','comando','foreign')
          on conflict do nothing;
          insert into companies(id,name,owner_user_id,tenant_id) values ('30000000-0000-0000-0000-000000000001','Company B','00000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000002') on conflict (id) do nothing;
          insert into payments(id,user_id,tenant_id,provider,external_reference,amount,currency_code,status) values ('40000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000002','internal','staging-b-payment',1,'BRL','pending') on conflict (id) do nothing;
          SQL
          echo "STAGING_TEST_TENANT_ID=10000000-0000-0000-0000-000000000001" >> "$GITHUB_ENV"
          echo "STAGING_TEST_USER_ID=00000000-0000-0000-0000-000000000001" >> "$GITHUB_ENV"
      - name: RLS SQL isolation under vertice_app
        run: |
          PGPASSWORD="$APP_DB_PASSWORD" psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -v TENANT_A_USER="$STAGING_TEST_USER_ID"             -v TENANT_A_ID="$STAGING_TEST_TENANT_ID"             -v TENANT_B_ID="10000000-0000-0000-0000-000000000002"             -f tests/rls-isolation.sql
      - run: npm run test:concurrency
      - name: Restart backend after migrations
        working-directory: .
        run: docker compose -f docker-compose.staging.yml restart backend worker
      - name: MFA retention and HTTP tenant isolation
        working-directory: server
        env:
          STAGING_BASE_URL: http://127.0.0.1:8080
        run: |
          sleep 3
          TOKEN_A=$(node -e "const jwt=require('jsonwebtoken'); console.log(jwt.sign({sub:'00000000-0000-0000-0000-000000000001',tenant_id:'10000000-0000-0000-0000-000000000001',role:'OWNER'},process.env.JWT_SECRET,{issuer:'vertice',audience:'vertice-app',expiresIn:'10m'}))")
          STATUS=$(curl -sS -o /tmp/mfa.json -w "%{http_code}" -X POST "$STAGING_BASE_URL/api/v1/execution" -H "Authorization: Bearer $TOKEN_A" -H "Idempotency-Key: mfa-staging-$(date +%s%N)" -H "Content-Type: application/json" --data '{"type":"payment","resource":"payment","operation":"charge","payload":{"amount":1}}')
          test "$STATUS" = "202"
          cat /tmp/mfa.json
          ID=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('/tmp/mfa.json','utf8')).actionId)")
          docker compose -f ../docker-compose.staging.yml exec -T postgres psql -U vertice_admin -d vertice_staging -Atc "select status from tasks where id='$ID'" | grep -qx awaiting_mfa
          STAGING_TOKEN_A="$TOKEN_A" STAGING_FOREIGN_COMMAND_ID="20000000-0000-0000-0000-000000000001" STAGING_FOREIGN_DEVICE_ID="device-b" npm run test:rls:http
      - run: npm run test:sandbox
      - name: Dependency and filesystem security scans
        run: npm audit --audit-level=high
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ".", severity: "HIGH,CRITICAL", exit-code: "1"}
      - uses: gitleaks/gitleaks-action@v3
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Staging evidence
        if: always()
        working-directory: .
        run: |
          docker compose -f docker-compose.staging.yml ps
          docker compose -f docker-compose.staging.yml logs --no-color --tail=200 postgres
          docker compose -f docker-compose.staging.yml logs --no-color --tail=200 redis
          docker compose -f docker-compose.staging.yml logs --no-color --tail=200 backend
          docker compose -f docker-compose.staging.yml logs --no-color --tail=200 worker
      - name: Teardown staging
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.staging.yml down -v
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
